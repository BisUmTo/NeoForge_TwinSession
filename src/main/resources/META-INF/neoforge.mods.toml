modLoader="javafml"
loaderVersion="${loader_version_range}"
license="CC0-1.0"
issueTrackerURL="https://github.com/TheMisterFish/Fabric_TwinSession/issues"

[[mods]]
modId="${mod_id}"
version="${mod_version}"
displayName="TwinSession"
authors="(The)MisterFish"
description='''
Want to be able to have two clients open and connect to the same world without one of the clients being kicked? Now you can with TwinSession!
'''
logoFile="assets/twinsession/icon.png"

[[mixins]]
config="twinsession.mixins.json"

[[dependencies.${mod_id}]]
modId="neoforge"
type="required"
versionRange="${neo_version_range}"
ordering="NONE"
side="BOTH"

[[dependencies.${mod_id}]]
modId="minecraft"
type="required"
versionRange="${minecraft_version_range}"
ordering="NONE"
side="BOTH"
